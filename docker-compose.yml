# Used by Dokploy's "Docker Compose" service. The named volume keeps the
# SQLite database across deploys; Dokploy adds the domain and HTTPS routing.
services:
  wishlists:
    build:
      context: .
      args:
        # Must match the public domain, or form posts fail Astro's origin check.
        SITE_HOSTNAME: ${SITE_HOSTNAME:-wishlists.willjackson.uk}
    restart: unless-stopped
    expose:
      - "4321"
    volumes:
      - wishlists-data:/data

volumes:
  wishlists-data:
